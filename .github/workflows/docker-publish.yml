name: Build and push Docker image

on:
  push:
    branches:
      - master
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  CI: true
  DOCKER_BUILDKIT: 1

jobs:
  build-and-push:
    # Run only for real pushes to the default branch (no PRs)
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        # we only need to vary the package manager; buildx will handle platforms
        package-manager: [apt, pacman]
        
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set image name
        run: |
          if [ "${{ matrix.package-manager }}" = "apt" ]; then
            echo "IMAGE_NAME=termux/termux-docker" >> $GITHUB_ENV
          else
            echo "IMAGE_NAME=termux/termux-docker-pacman" >> $GITHUB_ENV
          fi

      - name: (Optional) Generate build context
        # If your repo requires a generation step (your original ./generate.sh),
        # keep and adapt this. If you already have Dockerfiles in-tree for buildx,
        # you can remove this step.
        run: |
          chmod +x ./generate.sh || true
          ./generate.sh

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@4
        with:
          context: 
          platforms: linux/386,linux/amd64,linux/arm/v7,linux/arm64
          push: true
          tags: |
             ${{ env.IMAGE_NAME }}:latest
             ${{ env.IMAGE_NAME }}:${{ matrix.package-manager }}
          build-args: |
            TERMUX_PACKAGE_MANAGER=${{ matrix.package-manager }}
      
      - name: Export single-arch tar archives (optional, only if you need them)
        if: always()
        run: |
          # Export each arch-specific image (this requires images tagged per-arch).
          # If build-push-action pushed multi-arch manifests only, typical image pull will get the matching arch.
          # Example: pull the specific arch using --platform if needed
          ARCHS="386 amd64 arm v7 aarch64"
          for A in 386 amd64 arm v7 aarch64; do
          # map to platform name used in your old naming scheme
          TAG="${{ env.IMAGE_NAME }}:${A}"
          # try to pull platform-specific image (may fail if not available); continue on error
          docker pull --platform "linux/$([ \"$A\" = \"386\" ] && echo \"386\" || if [ \"$A\" = \"aarch64\" ]; then echo \"arm64\"; elif [ \"$A\" = \"arm\" -o \"$A\" = \"v7\" ]; then echo \"arm/v7\"; else echo \"$A\"; fi )" "${TAG}" || true
          OUT="termux-docker-${{ matrix.package-manager }}-${A}.tar"
          docker save -o "${OUT}" "${TAG}" || continue
          sha256sum "${OUT}" || true
          echo "${OUT}"
          done
          
      - name: Upload artifact (archives)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: termux-docker-${{ matrix.package-manager }}-${{ github.sha }}
          path: termux-docker-${{ matrix.package-manager }}-*.tar
          
